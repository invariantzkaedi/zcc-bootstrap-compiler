<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZCC Compiler Explorer & EVM Decompiler Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --bg-surface: #0e121a;
            --bg-elevated: #161c28;
            --bg-panel: #111622;
            --border: #232b3e;
            --border-highlight: #3b82f6;
            --text-main: #e2e8f0;
            --text-muted: #8b9bb4;
            --text-dim: #4b5568;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --font-code: 'Fira Code', monospace;
            --font-ui: 'Inter', sans-serif;
            --font-brand: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(14, 18, 26, 0.95) 100%);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-brand);
            font-weight: 800;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        .brand-title {
            font-family: var(--font-brand);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-verified {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .badge-verified::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* ── Controls Bar ── */
        .controls-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px 8px;
            gap: 8px;
        }

        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        select, button {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover, button:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .btn-action {
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: #fff;
            font-weight: 600;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #1d4ed8, #0369a1);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg-elevated);
        }

        /* ── Workspace Grid ── */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 105px);
        }

        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .panel-container {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-panel);
            overflow: hidden;
            position: relative;
        }

        .panel-header {
            background: var(--bg-surface);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-brand);
        }

        .panel-title .pill {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-elevated);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.2);
            font-family: var(--font-code);
        }

        .tab-bar {
            display: flex;
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--bg-elevated);
            color: var(--accent-cyan);
            box-shadow: inset 0 0 0 1px rgba(6, 182, 212, 0.3);
        }

        .editor-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .line-numbers {
            width: 48px;
            padding: 14px 8px;
            background: var(--bg-surface);
            color: var(--text-dim);
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.5;
            text-align: right;
            user-select: none;
            border-right: 1px solid var(--border);
            overflow-y: hidden;
        }

        textarea.code-editor {
            flex: 1;
            background: transparent;
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.5;
            padding: 14px;
            border: none;
            resize: none;
            outline: none;
            white-space: pre;
            tab-size: 4;
            overflow-y: auto;
        }

        .output-view {
            flex: 1;
            padding: 16px;
            font-family: var(--font-code);
            font-size: 12.5px;
            line-height: 1.55;
            overflow-y: auto;
            color: #d1d5db;
            background: #090c13;
        }

        /* ── Code Token Highlighting ── */
        .asm-label { color: #f472b6; font-weight: 600; }
        .asm-inst { color: #38bdf8; font-weight: 600; }
        .asm-reg { color: #a78bfa; }
        .asm-num { color: #facc15; }
        .asm-comm { color: #64748b; font-style: italic; }
        .ir-block { color: #ec4899; font-weight: 700; }
        .ir-phi { color: #fbbf24; font-weight: 600; }
        .ir-inst { color: #34d399; font-weight: 600; }
        .ir-var { color: #38bdf8; }
        .diff-del { background: rgba(239, 68, 68, 0.15); color: #fca5a5; text-decoration: line-through; display: block; }
        .diff-add { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; display: block; }

        /* ── Opt Passes Drawer ── */
        .opt-toggles {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .opt-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11.5px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .opt-chip.active {
            border-color: var(--accent-cyan);
            color: var(--text-main);
            background: rgba(6, 182, 212, 0.1);
        }

        .opt-chip input {
            cursor: pointer;
            accent-color: var(--accent-cyan);
        }

        /* ── Register Graph Canvas ── */
        #regGraphCanvas {
            width: 100%;
            height: 100%;
            background: #07090e;
            cursor: grab;
        }

        #regGraphCanvas:active {
            cursor: grabbing;
        }

        /* ── Footer ── */
        footer {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-code);
            font-size: 11px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>

            hamiltonian: `/*
 * ZKAEDI Sovereign Hamiltonian Particle Evolution Kernel
 * ======================================================
 * Ultimate demo kernel for the ZCC Compiler Explorer.
 */
#include <math.h>

#define SWARM_SIZE          24
#define STEPS               64
#define DT                  0.045f
#define ETA                 0.12f          /* energy coupling strength   */
#define GAMMA               2.35f          /* sigmoid steepness          */
#define BETA                0.65f          /* noise scaling              */
#define EPS                 0.055f         /* base noise amplitude       */
#define FIELD_BASE          0.85f
#define FIELD_OSC           0.28f
#define SOFT_WALL           1.38f
#define WALL_DAMP           0.81f
#define PHASE_RATE          0.065f
#define PHASE_ENERGY_GAIN   0.028f

typedef struct {
    float x, y;           /* position          */
    float vx, vy;         /* velocity          */
    float energy;         /* Hamiltonian energy */
    float phase;          /* internal oscillator */
    unsigned coin;        /* quantum-walk style coin (0/1) */
} Particle;

static float sigmoid(float x) {
    return 1.0f / (1.0f + expf(-x));
}

static float spatial_noise(float x, float y, int t) {
    unsigned u = (unsigned)(x * 982451653.0f + y * 2654435761.0f) + (unsigned)t * 747796405u;
    u = (u ^ (u >> 16)) * 0x85ebca6bu;
    u = (u ^ (u >> 13)) * 0xc2b2ae35u;
    u = u ^ (u >> 16);
    return ((float)(u & 0xFFFF) / 32768.0f) - 1.0f;
}

static unsigned long long mix64(unsigned long long x) {
    x ^= x >> 30;
    x *= 0xBF58476D1CE4E5B9ULL;
    x ^= x >> 27;
    x *= 0x94D049BB133111EBULL;
    x ^= x >> 31;
    return x;
}

static void evolve_particle(Particle *p, float field, int t) {
    float noise = spatial_noise(p->x, p->y, t);
    float sig   = sigmoid(GAMMA * p->energy);

    /* Hamiltonian energy update */
    float dH = ETA * p->energy * sig + EPS * noise * (1.0f + BETA * fabsf(p->energy));
    p->energy += dH * DT;

    /* Force from global field + phase coupling */
    p->vx += (-0.14f * p->x * field + 0.07f * sinf(p->phase)) * DT;
    p->vy += (-0.14f * p->y * field + 0.07f * cosf(p->phase)) * DT;

    p->x += p->vx * DT;
    p->y += p->vy * DT;

    /* Soft reflecting walls */
    if (p->x > SOFT_WALL || p->x < -SOFT_WALL) {
        p->vx *= -WALL_DAMP;
        p->x   = (p->x > 0.0f) ? SOFT_WALL : -SOFT_WALL;
        p->coin ^= 1u;
    }
    if (p->y > SOFT_WALL || p->y < -SOFT_WALL) {
        p->vy *= -WALL_DAMP;
        p->y   = (p->y > 0.0f) ? SOFT_WALL : -SOFT_WALL;
        p->coin ^= 1u;
    }

    p->phase += PHASE_RATE + PHASE_ENERGY_GAIN * p->energy;
    if (((unsigned)(p->phase * 1000.0f) & 0x1F) == 0)
        p->coin ^= 1u;
}

static float total_energy(const Particle *swarm) {
    float sum = 0.0f;
    for (int i = 0; i < SWARM_SIZE; i++)
        sum += swarm[i].energy;
    return sum;
}

int main(void) {
    Particle swarm[SWARM_SIZE];
    for (int i = 0; i < SWARM_SIZE; i++) {
        int row = i / 6;
        int col = i % 6;
        swarm[i].x      = (col - 2.5f) * 0.38f;
        swarm[i].y      = (row - 1.5f) * 0.42f;
        swarm[i].vx     = 0.0f;
        swarm[i].vy     = 0.0f;
        swarm[i].energy = 0.28f + 0.018f * (float)i;
        swarm[i].phase  = (float)i * 0.31f;
        swarm[i].coin   = (unsigned)i & 1u;
    }

    float field = FIELD_BASE;
    for (int t = 0; t < STEPS; t++) {
        for (int i = 0; i < SWARM_SIZE; i++)
            evolve_particle(&swarm[i], field, t);

        float e = total_energy(swarm);
        field = FIELD_BASE + FIELD_OSC * sinf((float)t * 0.09f) + 0.04f * e;
    }

    unsigned long long acc = 0;
    for (int i = 0; i < SWARM_SIZE; i++) {
        unsigned long long px = (unsigned long long)(swarm[i].x * 10000.0f + 50000.0f);
        unsigned long long py = (unsigned long long)(swarm[i].y * 10000.0f + 50000.0f);
        unsigned long long en = (unsigned long long)(swarm[i].energy * 1000.0f);
        acc ^= mix64(px ^ (py << 17) ^ (en << 7) ^ swarm[i].coin);
        acc = mix64(acc);
    }
    return (int)(acc & 0xFF);
}`,

            god_pressure: `/*
 * Ultimate Register-Pressure God-Engine
 * =====================================
 * Designed specifically to feed God's Eye graph coloring visualizer.
 */
#include <stdint.h>

#define MIX_ROUNDS 5

static int32_t pressure_core(
    int32_t a0, int32_t a1, int32_t a2, int32_t a3,
    int32_t a4, int32_t a5, int32_t a6, int32_t a7,
    int32_t b0, int32_t b1, int32_t b2, int32_t b3,
    int32_t b4, int32_t b5, int32_t b6, int32_t b7
) {
    int32_t s0 = a0 + b0; int32_t s1 = a1 + b1; int32_t s2 = a2 + b2; int32_t s3 = a3 + b3;

        let draggedNode = null;

        function initGraphPhysics() {
            const canvas = document.getElementById('regGraphCanvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const palette = ['#38bdf8', '#a78bfa', '#34d399', '#facc15', '#f472b6', '#ec4899', '#06b6d4', '#fb923c'];
            const names = ['%rax', '%rcx', '%rdx', '%rsi', '%rdi', '%r8', '%r9', '%r10', '%r11', '%r12', '%r13', '%r14'];

            graphNodes = names.slice(0, 8).map((name, i) => ({
                id: `v${i}`,
                x: canvas.width * 0.2 + (i % 4) * (canvas.width * 0.2),
                y: canvas.height * 0.25 + Math.floor(i / 4) * (canvas.height * 0.45) + (Math.random() * 20 - 10),
                vx: 0,
                vy: 0,
                color: palette[i % palette.length],
                label: `v${i} (${name})`
            }));

            graphEdges = [
                [0, 1], [0, 3], [1, 2], [1, 6], [2, 5], [3, 4], [4, 5], [4, 6], [2, 6], [0, 6], [3, 7], [5, 7]
            ];

            canvas.onmousedown = (e) => {
                const cRect = canvas.getBoundingClientRect();
                const mx = e.clientX - cRect.left;
                const my = e.clientY - cRect.top;
                draggedNode = graphNodes.find(n => Math.hypot(n.x - mx, n.y - my) < 26);
            };

            window.onmousemove = (e) => {
                if (draggedNode) {
                    const cRect = canvas.getBoundingClientRect();
                    draggedNode.x = e.clientX - cRect.left;
                    draggedNode.y = e.clientY - cRect.top;
                    renderRegisterGraph();
                }
            };

            window.onmouseup = () => {
                draggedNode = null;
            };
        }

        function renderRegisterGraph() {
            const canvas = document.getElementById('regGraphCanvas');
            if (!canvas) return;
            if (graphNodes.length === 0) initGraphPhysics();

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw edges (Interference)
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
            graphEdges.forEach(([from, to]) => {
                if (graphNodes[from] && graphNodes[to]) {
                    ctx.beginPath();
                    ctx.moveTo(graphNodes[from].x, graphNodes[from].y);
                    ctx.lineTo(graphNodes[to].x, graphNodes[to].y);
                    ctx.stroke();
                }
            });

            // Draw nodes
            graphNodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 22, 0, 2 * Math.PI);
                ctx.fillStyle = node.color;
                ctx.shadowColor = node.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = '11.5px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(node.label, node.x, node.y + 36);
            });
        }

        function copyPermalink() {
            const state = {
                preset: document.getElementById('snippetSelect').value,
                target: document.getElementById('targetSelect').value
            };
            const hash = btoa(JSON.stringify(state));
            window.location.hash = hash;
            navigator.clipboard.writeText(window.location.href);
            alert('📋 Shareable permalink copied to clipboard!');
        }

        function exportArtifact() {
            const asm = document.getElementById('viewAsm').innerText;
            const blob = new Blob([asm], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sovereign_kernel_${document.getElementById('targetSelect').value}.s`;
            a.click();
            URL.revokeObjectURL(url);
        }

        window.addEventListener('resize', () => {
            if (currentActiveTab === 'graph') {
                initGraphPhysics();
                renderRegisterGraph();
            }
        });

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                try {
                    const state = JSON.parse(atob(window.location.hash.slice(1)));
                    if (state.preset) document.getElementById('snippetSelect').value = state.preset;
                    if (state.target) document.getElementById('targetSelect').value = state.target;
                } catch(e) {}
            }
            loadPreset(document.getElementById('snippetSelect').value || 'hamiltonian');
        });
    </script>
</body>
</html>

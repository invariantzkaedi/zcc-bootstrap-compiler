name: ZKAEDI Sovereign Quantum Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quantum-sovereign-pipeline:
    name: Quantum DSP -> SP1 zk-VM -> Pure Yul Settlement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy web3 eth-abi

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install System Dependencies & RISC-V Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libssl-dev gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Install Solc 0.8.26
        run: |
          sudo wget -q -O /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          sudo chmod +x /usr/local/bin/solc
          solc --version

      - name: Execute Full End-to-End Quantum Pipeline Gate
        run: |
          make check-quantum-pipeline-all

      - name: Run SP1 Dual-Path Differential Prover & VKey Extraction
        run: |
          make sp1-prove-diff
          make sp1-vkey
          make sp1-prove-local

      - name: Run Foundry Settlement Test Suite & Anvil Deployment
        run: |
          make test-foundry-quantum
          make deploy-anvil-quantum

      - name: Verify Artifact Integrity
        run: |
          test -f artifacts/quantum_walk_16node_stem.wav
          test -f artifacts/QuantumSettlement.bin
          test -f artifacts/sp1_quantum_vkey.json
          test -f artifacts/sp1_quantum_proof.bin
          echo "All Sovereign Trinity artifacts verified on disk."

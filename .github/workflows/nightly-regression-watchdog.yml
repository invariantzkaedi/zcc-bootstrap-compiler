name: Nightly Regression Watchdog

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build baseline and candidate
        run: |
          set -euo pipefail
          make clean
          make all OUT=build/base BASELINE=1
          make all OUT=build/cand

      - name: Run robust benchmark harness
        run: |
          set -euo pipefail
          chmod +x scripts/bench/run_robust_benchmarks.sh
          scripts/bench/run_robust_benchmarks.sh \
            --base build/base/zcc \
            --cand build/cand/zcc \
            --suite benchmarks/list.txt \
            --warmup 2 \
            --runs 10 \
            --trim 0.10 \
            --out out/bench

      - name: Evaluate watchdog
        run: |
          python3 scripts/bench/regression_watchdog.py \
            --summary out/bench/summary.json \
            --max-hard-regressions 2 \
            --hard-threshold-pct -2.0

      - name: Upload verified benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench-summary-${{ github.run_id }}
          path: out/bench/
          retention-days: 30
          if-no-files-found: error

name: System Verification Invariants

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Native Verification Pipeline
        run: |
          make verify

      - name: Archive Machine Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.sha }}
          path: evidence/

name: ZCC Boundary Contract Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  boundary-enforcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GCC, Make, Binutils & Python packages
        run: |
          sudo apt-get update || true
          sudo apt-get install -y gcc make binutils python3 python3-pip
          python3 -m pip install pytest jsonschema numpy --break-system-packages || python3 -m pip install pytest jsonschema numpy

      - name: Run Schema & Boundary Validations
        env:
          PYTHONPATH: .
        run: |
          python3 scripts/zcc_template_recognizer.py
          python3 -m pytest -q tests/test_trace_schema_validation.py tests/test_invariants_battery.py tests/test_determinism_contract.py
          python3 scripts/check_policy_conformance.py

name: Auto PR Bench Comment

on:
  workflow_run:
    workflows: ["IR Opt Bench Gate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bench summary artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const {owner, repo} = context.repo;
            const arts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id});
            const art = arts.data.artifacts.find(a => a.name.startsWith("bench-artifacts-"));
            if (!art) core.setFailed("No bench artifact found");
            const zip = await github.rest.actions.downloadArtifact({
              owner, repo, artifact_id: art.id, archive_format: "zip"
            });
            require("fs").writeFileSync("bench.zip", Buffer.from(zip.data));

      - name: Extract and post comment
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o bench.zip -d out
          SUMMARY="out/summary.md"
          test -f "$SUMMARY" || SUMMARY="$(find out -name summary.md | head -n1)"
          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number' "$GITHUB_EVENT_PATH")"
          gh pr comment "$PR_NUMBER" --body-file "$SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

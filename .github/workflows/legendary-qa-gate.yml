name: Legendary QA Gate

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  legendary-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Legendary Experiment Suite
        run: |
          python tools/run_legendary_experiments.py

      - name: Locate latest artifact run
        id: locate
        shell: bash
        run: |
          LATEST_RUN_DIR=$(ls -1dt artifacts/qa/* | head -n 1)
          echo "latest_run_dir=$LATEST_RUN_DIR" >> $GITHUB_OUTPUT
          echo "Found latest run: $LATEST_RUN_DIR"

      - name: Compute Legendary Readiness Score
        id: score
        shell: bash
        run: |
          SCORE_OUTPUT=$(python tools/legendary_readiness_score.py "${{ steps.locate.outputs.latest_run_dir }}/results.json")
          echo "$SCORE_OUTPUT"
          SCORE=$(echo "$SCORE_OUTPUT" | grep -Eo 'Legendary Readiness Score: [0-9]+(\.[0-9]+)?' | awk '{print $4}' | cut -d'/' -f1)
          VERDICT=$(echo "$SCORE_OUTPUT" | sed -n 's/^Verdict: //p')
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT

      - name: Enforce minimum score gate
        shell: bash
        env:
          MIN_SCORE: "85"
        run: |
          SCORE="${{ steps.score.outputs.score }}"
          echo "Gate check: score=$SCORE, minimum=$MIN_SCORE"
          awk -v s="$SCORE" -v m="$MIN_SCORE" 'BEGIN { exit (s+0 >= m+0) ? 0 : 1 }' \
            || (echo "❌ Legendary QA Gate failed: score $SCORE < $MIN_SCORE" && exit 1)
          echo "✅ Legendary QA Gate passed: score $SCORE >= $MIN_SCORE"

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legendary-qa-artifacts
          path: ${{ steps.locate.outputs.latest_run_dir }}

      - name: Publish step summary
        shell: bash
        run: |
          {
            echo "## Legendary QA Gate Result"
            echo ""
            echo "- **Score:** ${{ steps.score.outputs.score }}"
            echo "- **Verdict:** ${{ steps.score.outputs.verdict }}"
            echo "- **Artifacts:** \`${{ steps.locate.outputs.latest_run_dir }}\`"
            echo ""
            echo "### Summary"
            cat "${{ steps.locate.outputs.latest_run_dir }}/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

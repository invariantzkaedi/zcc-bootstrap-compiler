compiler:
  - changed-files:
      - any-glob-to-any-file:
          - "src/ir/**"
          - "src/verifier/**"
optimizer:
  - changed-files:
      - any-glob-to-any-file:
          - "src/opt/**"
perf:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/bench/**"
          - "benchmarks/**"
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
infra:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/ci/**"
qa:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
release:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/releases/**"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZCC Compiler Lab - Interactive AST & IR Explorer</title>
  <link rel="stylesheet" href="animations.css">
  <style>
    :root {
      --bg: #05060f;
      --panel: rgba(8, 10, 24, 0.85);
      --border: rgba(0, 255, 204, 0.15);
      --text: #e8f8ff;
      --muted: #8091a8;
      --cyan: #00ffcc;
      --pink: #ff007f;
      --violet: #9b5de5;
      --green: #00ff88;
      --amber: #ffaa00;
      --red: #ff3366;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .cockpit {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
      height: calc(100vh - 32px);
    }

    .controls-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.05);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-area h2 {
      margin: 0;
      font: 900 18px/1 Inter, sans-serif;
      letter-spacing: -0.02em;
    }

    .selector {
      background: #0d0f1a;
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 8px 12px;
      border-radius: 8px;
      font: 700 12px monospace;
      outline: none;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font: 700 11px/1 monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .action-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0,255,204,0.15);
    }

    .action-btn.active {
      background: rgba(255, 0, 127, 0.1);
      border-color: var(--pink);
      color: var(--pink);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 180px 1.1fr;
      gap: 16px;
      min-height: 0;
    }

    .pane {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.03);
    }

    .pane-header {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font: 800 11px/1 monospace;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    .pane-content {
      padding: 16px;
      overflow-y: auto;
      min-height: 0;
      position: relative;
    }

    /* AST TREE DESIGN */
    .ast-tree {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ast-node {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      font: 700 12px monospace;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
    }

    .ast-node:hover {
      border-color: rgba(0, 255, 204, 0.35);
      background: rgba(0, 255, 204, 0.04);
      transform: translateX(4px);
    }

    .ast-node.selected {
      border-color: var(--cyan);
      background: rgba(0, 255, 204, 0.08);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
    }

    .ast-node.trace-start {
      border-color: var(--amber) !important;
      background: rgba(255, 170, 0, 0.1) !important;
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.2) !important;
    }

    .ast-node.trace-end {
      border-color: var(--pink) !important;
      background: rgba(255, 0, 127, 0.1) !important;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2) !important;
    }

    .ast-node.in-trace-path {
      border-color: var(--violet) !important;
      background: rgba(155, 93, 229, 0.1) !important;
      box-shadow: 0 0 12px rgba(155, 93, 229, 0.15) !important;
    }

    .node-kind {
      color: var(--pink);
      font-weight: 900;
    }

    .node-val {
      color: var(--cyan);
    }

    .node-indent {
      width: 20px;
      height: 100%;
      border-left: 1px dashed rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    /* CENTER DIVIDER (LOWERING TRACKS) */
    .events-timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px;
      overflow-y: auto;
      align-items: center;
      border: 1px solid var(--border);
      background: rgba(4, 5, 12, 0.5);
      border-radius: 14px;
    }

    .event-card {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.04);
      font: 600 10px monospace;
      color: var(--muted);
      text-align: center;
      transition: all 0.25s;
    }

    .event-card.active {
      border-color: var(--violet);
      color: var(--violet);
      background: rgba(155,93,229,0.05);
      box-shadow: 0 0 10px rgba(155,93,229,0.1);
      transform: scale(1.03);
    }

    .flow-arrow {
      color: rgba(255,255,255,0.1);
      font-size: 14px;
    }

    /* IR VIEW DESIGN */
    .ir-pane {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ir-block {
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      background: #04050a;
      overflow: hidden;
    }

    .ir-label {
      padding: 6px 12px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font: 800 11px monospace;
      color: var(--amber);
    }

    .ir-instrs {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ir-line {
      font: 600 12px monospace;
      color: #9eb7d4;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ir-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .ir-line.active {
      background: rgba(0, 255, 204, 0.12) !important;
      color: var(--cyan);
      box-shadow: inset 2px 0 0 var(--cyan);
    }

    /* CONSOLE LOG */
    .console {
      grid-column: 1 / -1;
      height: 120px;
      background: #020206;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font: 500 11px monospace;
      color: #58a6ff;
      overflow-y: auto;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .console-line {
      margin-bottom: 4px;
    }
  </style>
</head>
<body class="bg-drift">
  <div class="cockpit">
    <div class="controls-strip">
      <div class="title-area">
        <h2>Compiler Lab</h2>
        <select class="selector" id="example-select">
          <option value="next_token">next_token (skip_block_comments)</option>
          <option value="factorial">factorial_recursive (call lowering)</option>
          <option value="struct_access">struct_alignment_access (offset GEP)</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="action-btn" id="btn-trace">Path Trace Mode</button>
        <button class="action-btn" id="btn-heatmap">Complexity Map</button>
        <button class="action-btn" id="btn-reset">Reset Explorer</button>
      </div>
    </div>

    <div class="workspace">
      <!-- AST PANE -->
      <div class="pane glass section-enter">
        <div class="pane-header">
          <span>Abstract Syntax Tree</span>
          <span style="color:var(--pink)">AST</span>
        </div>
        <div class="pane-content" id="ast-content">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- TIMELINE / TRANSITIONS -->
      <div class="events-timeline" id="events-content">
        <!-- Populated by JS -->
      </div>

      <!-- IR PANE -->
      <div class="pane glass section-enter" style="animation-delay: 80ms;">
        <div class="pane-header">
          <span>Lowered Intermediate Representation</span>
          <span style="color:var(--amber)">ZCC-IR</span>
        </div>
        <div class="pane-content" id="ir-content">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- CONSOLE -->
      <div class="console" id="console-content">
        <div class="console-line">> ZCC Compiler Lab initialized. Select nodes to view lowering transitions.</div>
      </div>
    </div>
  </div>

  <script>
    // Data definition for compilation mock templates
    const templates = {
      next_token: {
        ast: [
          { id: "a1", indent: 0, kind: "IfStmt", value: "", depth: 1, branch: 2, ir_lines: ["i4", "i5"] },
          { id: "a2", indent: 1, kind: "BinaryExpr", value: "== '*'", depth: 2, branch: 2, ir_lines: ["i1", "i2", "i3"] },
          { id: "a3", indent: 1, kind: "IfStmt", value: "", depth: 2, branch: 2, ir_lines: ["i8", "i9"] },
          { id: "a4", indent: 2, kind: "BinaryExpr", value: "== '/'", depth: 3, branch: 2, ir_lines: ["i6", "i7"] },
          { id: "a5", indent: 2, kind: "ExprStmt", value: "cc->pos += 2", depth: 3, branch: 1, ir_lines: ["i10", "i11"] },
          { id: "a6", indent: 2, kind: "GotoStmt", value: "again", depth: 3, branch: 1, ir_lines: ["i12"] },
          { id: "a7", indent: 0, kind: "ExprStmt", value: "cc->pos++", depth: 1, branch: 1, ir_lines: ["i13", "i14"] }
        ],
        events: [
          { id: "e1", title: "zcc_lower_stmt", active_node: "a1" },
          { id: "e2", title: "codegen_expr_bin", active_node: "a2" },
          { id: "e3", title: "emit_cond_jump", active_node: "a1" },
          { id: "e4", title: "zcc_lower_stmt", active_node: "a3" },
          { id: "e5", title: "codegen_expr_bin", active_node: "a4" },
          { id: "e6", title: "emit_cond_jump", active_node: "a3" },
          { id: "e7", title: "emit_add_offset", active_node: "a5" },
          { id: "e8", title: "emit_uncond_jmp", active_node: "a6" },
          { id: "e9", title: "emit_post_inc", active_node: "a7" }
        ],
        ir: [
          {
            label: "entry_block:",
            lines: [
              { id: "i1", text: "%t1 = load %cc.source" },
              { id: "i2", text: "%t2 = load %cc.pos" },
              { id: "i3", text: "%t3 = load_offset %t1, %t2" },
              { id: "i4", text: "%t4 = compare_eq %t3, 42" },
              { id: "i5", text: "cond_br %t4, block1, block_false" }
            ]
          },
          {
            label: "block1:",
            lines: [
              { id: "i6", text: "%t5 = add %t2, 1" },
              { id: "i7", text: "%t6 = load_offset %t1, %t5" },
              { id: "i8", text: "%t7 = compare_eq %t6, 47" },
              { id: "i9", text: "cond_br %t7, block2, block_false" }
            ]
          },
          {
            label: "block2:",
            lines: [
              { id: "i10", text: "%t8 = add %t2, 2" },
              { id: "i11", text: "store %cc.pos, %t8" },
              { id: "i12", text: "br again" }
            ]
          },
          {
            label: "block_false:",
            lines: [
              { id: "i13", text: "%t9 = add %t2, 1" },
              { id: "i14", text: "store %cc.pos, %t9" }
            ]
          }
        ]
      },
      factorial: {
        ast: [
          { id: "f1", indent: 0, kind: "IfStmt", value: "n <= 1", depth: 1, branch: 2, ir_lines: ["fi1", "fi2"] },
          { id: "f2", indent: 1, kind: "ReturnStmt", value: "1", depth: 2, branch: 1, ir_lines: ["fi3", "fi4"] },
          { id: "f3", indent: 0, kind: "ReturnStmt", value: "n * factorial(n - 1)", depth: 1, branch: 1, ir_lines: ["fi5", "fi6", "fi7", "fi8"] }
        ],
        events: [
          { id: "fe1", title: "zcc_lower_stmt", active_node: "f1" },
          { id: "fe2", title: "emit_cond_jump", active_node: "f1" },
          { id: "fe3", title: "emit_return", active_node: "f2" },
          { id: "fe4", title: "emit_sub_imm", active_node: "f3" },
          { id: "fe5", title: "emit_call", active_node: "f3" },
          { id: "fe6", title: "emit_mul", active_node: "f3" }
        ],
        ir: [
          {
            label: "entry_block:",
            lines: [
              { id: "fi1", text: "%t1 = load %n" },
              { id: "fi2", text: "%t2 = compare_le %t1, 1" },
              { id: "fi3", text: "cond_br %t2, block_then, block_else" }
            ]
          },
          {
            label: "block_then:",
            lines: [
              { id: "fi4", text: "return 1" }
            ]
          },
          {
            label: "block_else:",
            lines: [
              { id: "fi5", text: "%t3 = sub %t1, 1" },
              { id: "fi6", text: "%t4 = call factorial, %t3" },
              { id: "fi7", text: "%t5 = mul %t1, %t4" },
              { id: "fi8", text: "return %t5" }
            ]
          }
        ]
      },
      struct_access: {
        ast: [
          { id: "s1", indent: 0, kind: "DeclStmt", value: "struct Point pt", depth: 1, branch: 1, ir_lines: ["si1"] },
          { id: "s2", indent: 0, kind: "ExprStmt", value: "pt.y = 42", depth: 1, branch: 1, ir_lines: ["si2", "si3", "si4"] }
        ],
        events: [
          { id: "se1", title: "zcc_lower_decl", active_node: "s1" },
          { id: "se2", title: "emit_alloca", active_node: "s1" },
          { id: "se3", title: "emit_gep_offset", active_node: "s2" },
          { id: "se4", title: "emit_store", active_node: "s2" }
        ],
        ir: [
          {
            label: "entry_block:",
            lines: [
              { id: "si1", text: "%pt = alloca Point, size=16" },
              { id: "si2", text: "%t1 = gep %pt, offset=8" },
              { id: "si3", text: "store %t1, 42" },
              { id: "si4", text: "ret" }
            ]
          }
        ]
      }
    };

    let selectedNode = null;
    let traceStart = null;
    let traceEnd = null;
    let isTraceMode = false;
    let isHeatmap = false;

    const astContent = document.getElementById("ast-content");
    const irContent = document.getElementById("ir-content");
    const eventsContent = document.getElementById("events-content");
    const exampleSelect = document.getElementById("example-select");
    const consoleContent = document.getElementById("console-content");

    const btnTrace = document.getElementById("btn-trace");
    const btnHeatmap = document.getElementById("btn-heatmap");
    const btnReset = document.getElementById("btn-reset");

    function logConsole(msg) {
      const el = document.createElement("div");
      el.className = "console-line";
      el.innerText = `> [${new Date().toLocaleTimeString()}] ${msg}`;
      consoleContent.appendChild(el);
      consoleContent.scrollTop = consoleContent.scrollHeight;
    }

    function renderActiveExample() {
      const activeKey = exampleSelect.value;
      const data = templates[activeKey];

      // Reset states
      selectedNode = null;
      traceStart = null;
      traceEnd = null;

      // 1. Render AST
      astContent.innerHTML = "";
      const treeDiv = document.createElement("div");
      treeDiv.className = "ast-tree";
      data.ast.forEach(n => {
        const row = document.createElement("div");
        row.className = "ast-node";
        row.dataset.id = n.id;
        
        // Add indentation lines
        for (let i = 0; i < n.indent; i++) {
          const line = document.createElement("div");
          line.className = "node-indent";
          row.appendChild(line);
        }

        const kindSpan = document.createElement("span");
        kindSpan.className = "node-kind";
        kindSpan.innerText = n.kind;
        row.appendChild(kindSpan);

        if (n.value) {
          const valSpan = document.createElement("span");
          valSpan.className = "node-val";
          valSpan.innerText = n.value;
          row.appendChild(valSpan);
        }

        row.addEventListener("click", () => handleNodeClick(n, row));
        treeDiv.appendChild(row);
      });
      astContent.appendChild(treeDiv);

      // 2. Render Timeline Events
      eventsContent.innerHTML = "";
      data.events.forEach(e => {
        const card = document.createElement("div");
        card.className = "event-card";
        card.id = `evt-${e.id}`;
        card.innerText = e.title;
        eventsContent.appendChild(card);

        const arrow = document.createElement("div");
        arrow.className = "flow-arrow";
        arrow.innerText = "↓";
        eventsContent.appendChild(arrow);
      });
      // Remove last trailing arrow
      if (eventsContent.lastChild) {
        eventsContent.removeChild(eventsContent.lastChild);
      }

      // 3. Render IR
      irContent.innerHTML = "";
      data.ir.forEach(b => {
        const blockDiv = document.createElement("div");
        blockDiv.className = "ir-block";

        const label = document.createElement("div");
        label.className = "ir-label";
        label.innerText = b.label;
        blockDiv.appendChild(label);

        const instrs = document.createElement("div");
        instrs.className = "ir-instrs";
        b.lines.forEach(l => {
          const line = document.createElement("div");
          line.className = "ir-line";
          line.id = `ir-${l.id}`;
          line.innerText = l.text;
          instrs.appendChild(line);
        });
        blockDiv.appendChild(instrs);
        irContent.appendChild(blockDiv);
      });

      logConsole(`Loaded compiler scenario: '${activeKey}'`);
      if (isHeatmap) renderHeatmap();
    }

    function handleNodeClick(node, el) {
      if (isTraceMode) {
        if (!traceStart) {
          traceStart = node.id;
          el.classList.add("trace-start");
          logConsole(`Trace start set: ${node.kind}`);
        } else if (!traceEnd) {
          traceEnd = node.id;
          el.classList.add("trace-end");
          logConsole(`Trace end set: ${node.kind}`);
          performTrace();
        } else {
          // Reset trace
          clearTraceHighlights();
          traceStart = node.id;
          el.classList.add("trace-start");
          logConsole(`Trace restarted at: ${node.kind}`);
        }
        return;
      }

      // Standard node lookup / highlighting
      document.querySelectorAll(".ast-node").forEach(n => n.classList.remove("selected"));
      el.classList.add("selected");
      selectedNode = node.id;

      // Pulse matching lower event cards
      document.querySelectorAll(".event-card").forEach(c => c.classList.remove("active"));
      const activeKey = exampleSelect.value;
      const data = templates[activeKey];
      const matchEvts = data.events.filter(e => e.active_node === node.id);
      matchEvts.forEach(e => {
        const c = document.getElementById(`evt-${e.id}`);
        if (c) c.classList.add("active");
      });

      // Highlight target IR instruction lines
      document.querySelectorAll(".ir-line").forEach(l => l.classList.remove("active"));
      node.ir_lines.forEach(id => {
        const line = document.getElementById(`ir-${id}`);
        if (line) line.classList.add("active");
      });

      logConsole(`Inspecting AST Node: ${node.kind} (${node.value || "no payload"}). Emits ${node.ir_lines.length} IR instructions.`);
    }

    function performTrace() {
      if (!traceStart || !traceEnd) return;
      const activeKey = exampleSelect.value;
      const data = templates[activeKey];

      // Find indices in AST list
      const idxA = data.ast.findIndex(n => n.id === traceStart);
      const idxB = data.ast.findIndex(n => n.id === traceEnd);
      if (idxA === -1 || idxB === -1) return;

      const start = Math.min(idxA, idxB);
      const end = Math.max(idxA, idxB);

      // Highlight intermediates
      const pathNodes = [];
      for (let i = start + 1; i < end; i++) {
        const node = data.ast[i];
        pathNodes.push(node);
        const el = document.querySelector(`.ast-node[data-id="${node.id}"]`);
        if (el) el.classList.add("in-trace-path");
      }

      logConsole(`Path Trace complete. Found ${end - start - 1} intermediate AST steps between selection.`);
    }

    function clearTraceHighlights() {
      document.querySelectorAll(".ast-node").forEach(n => {
        n.classList.remove("trace-start", "trace-end", "in-trace-path");
      });
      traceStart = null;
      traceEnd = null;
    }

    function renderHeatmap() {
      const activeKey = exampleSelect.value;
      const data = templates[activeKey];

      data.ast.forEach(n => {
        const el = document.querySelector(`.ast-node[data-id="${n.id}"]`);
        if (!el) return;

        if (isHeatmap) {
          // Color based on branching + depth
          const weight = (n.depth * 0.25) + (n.branch * 0.35);
          if (weight > 1.2) {
            el.style.background = "rgba(255, 51, 102, 0.2)";
            el.style.borderColor = "var(--red)";
          } else if (weight > 0.8) {
            el.style.background = "rgba(255, 170, 0, 0.2)";
            el.style.borderColor = "var(--amber)";
          } else {
            el.style.background = "rgba(0, 255, 136, 0.15)";
            el.style.borderColor = "var(--green)";
          }
        } else {
          // Restore default inline style
          el.style.background = "";
          el.style.borderColor = "";
        }
      });
    }

    // Controls setup
    exampleSelect.addEventListener("change", renderActiveExample);

    btnTrace.addEventListener("click", () => {
      isTraceMode = !isTraceMode;
      btnTrace.classList.toggle("active", isTraceMode);
      clearTraceHighlights();
      logConsole(isTraceMode ? "Trace Path mode ENGAGED. Select two nodes to find connection path." : "Trace Path mode DISENGAGED.");
    });

    btnHeatmap.addEventListener("click", () => {
      isHeatmap = !isHeatmap;
      btnHeatmap.classList.toggle("active", isHeatmap);
      renderHeatmap();
      logConsole(isHeatmap ? "Complexity Heat Map overlays RENDERED." : "Complexity Heat Map overlays CLEARED.");
    });

    btnReset.addEventListener("click", () => {
      clearTraceHighlights();
      document.querySelectorAll(".ast-node").forEach(n => n.classList.remove("selected"));
      document.querySelectorAll(".event-card").forEach(c => c.classList.remove("active"));
      document.querySelectorAll(".ir-line").forEach(l => l.classList.remove("active"));
      isTraceMode = false;
      isHeatmap = false;
      btnTrace.classList.remove("active");
      btnHeatmap.classList.remove("active");
      renderActiveExample();
      logConsole("Explorer state has been reset.");
    });

    // Initial render
    renderActiveExample();
  </script>
</body>
</html>
